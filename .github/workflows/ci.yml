name: CI

on:
  pull_request:
  push:
    branches: [master]

# Read-only token: this workflow only checks code, it never writes back.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generates the route/layout types (e.g. LayoutProps) tsc relies on.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
